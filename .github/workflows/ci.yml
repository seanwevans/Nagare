name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .

  test-python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      # tests/test_tester.py and tests/test_ring_buffer.py compile the C sources.
      - run: pytest --cov --cov-report=term-missing

  build-c:
    name: C build + sanitizers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build with warnings as errors
        run: make CFLAGS="-O2 -Wall -Wextra -Werror" all
      - name: Rebuild under ASan/UBSan
        run: |
          make clean
          make CFLAGS="-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer" all
      - name: Exercise the ring buffer under sanitizers
        run: ./ring
      - name: Static analysis
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cppcheck
          cppcheck --error-exitcode=1 --enable=warning,performance,portability \
            --suppress=missingIncludeSystem nagare.c ring.c tester.c

  docker:
    name: Container build + smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: nagare-webapp:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          docker run -d --name nagare -p 8000:8000 nagare-webapp:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/healthz; then ok=1; break; fi
            sleep 1
          done
          test -n "$ok" || { docker logs nagare; exit 1; }
          curl -fsS -X POST http://127.0.0.1:8000/simulate \
            -H 'Content-Type: application/json' \
            -d '{"vectorField":{"fx":"1","fy":"0"},"entities":[{"id":"e","x":0,"y":0}],"settings":{"duration":1,"dt":0.5}}' \
            | grep -q '"frames"'
          docker rm -f nagare
